name: Quick October RTT validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/import_metascribe_singles.py'
      - 'scripts/run_singles_imports.py'
      - '.github/workflows/refresh-singles-rtt.yml'
permissions:
  contents: write
concurrency:
  group: singles-dataset-refresh
  cancel-in-progress: false
jobs:
  import-rtt:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Collect and validate 15-player October RTT
        id: ingest
        continue-on-error: true
        run: python scripts/run_singles_imports.py --event october-rtt-2026
      - name: Audit all published match records
        run: python scripts/audit_cross_sources.py
      - name: Publish only validated games and status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/singles-october-rtt-2026.csv public/data/singles-import-status.json public/data/cross-source-audit.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Validate October RTT results and preserve diagnostics"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Mark unsuccessful import
        if: steps.ingest.outcome == 'failure'
        run: exit 1

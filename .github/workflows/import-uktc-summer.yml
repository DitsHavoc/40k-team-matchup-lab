name: Import UKTC Summer ITT 2026
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/import_metascribe_event.py'
      - '.github/workflows/import-uktc-summer.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Collect all UKTC Summer ITT 2026 matchups and validate
        run: python scripts/import_metascribe_event.py --event uktc-summer-itt-2026
      - name: Commit validated UKTC games
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/uktc-summer-itt-2026.csv
          if ! git diff --cached --quiet; then
            git commit -m "Import validated UKTC Summer ITT games"
            git push
          fi

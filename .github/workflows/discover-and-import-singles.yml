name: Discover and validate worldwide singles events
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/discover_metascribe_singles.py'
      - 'scripts/run_discovered_singles.py'
      - 'scripts/import_metascribe_singles.py'
      - '.github/workflows/discover-and-import-singles.yml'
  schedule:
    - cron: '07 3 * * *'
permissions:
  contents: write
concurrency:
  group: worldwide-event-discovery
  cancel-in-progress: false
jobs:
  discover-and-collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 playwright
      - name: Install headless browser for JavaScript-rendered event lists
        run: python -m playwright install --with-deps chromium
      - name: Discover 2026 11th edition singles events globally
        id: discovery
        continue-on-error: true
        run: python scripts/discover_metascribe_singles.py --pages 15 --limit 300
      - name: Collect up to eight separately verified singles events
        id: ingest
        if: steps.discovery.outcome == 'success'
        continue-on-error: true
        run: python scripts/run_discovered_singles.py --limit 8 --max-players 250
      - name: Audit overlap with existing tournament results
        run: python scripts/audit_cross_sources.py
      - name: Publish only validated game-level datasets and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in public/data/singles-discovery.json public/data/singles-discovery-status.json public/data/auto-import-status.json public/data/cross-source-audit.json public/data/singles-auto-*.csv; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified worldwide singles game evidence"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Expose discovery or validation failures
        if: steps.discovery.outcome == 'failure' || steps.ingest.outcome == 'failure'
        run: exit 1

name: Discover and validate worldwide singles events
# Explicit rerun requested after 2026-11-16 importer changes.
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/discover_metascribe_singles.py'
      - 'scripts/run_discovered_singles.py'
      - 'scripts/import_metascribe_singles.py'
      - 'scripts/build_warehouse.py'
      - 'scripts/event_identity.py'
      - 'scripts/import_listhammer_export.py'
      - 'scripts/test_event_identity.py'
      - '.github/workflows/discover-and-import-singles.yml'
  schedule:
    - cron: '07 3,9,15,21 * * *'
permissions:
  contents: write
concurrency:
  group: worldwide-event-discovery
  cancel-in-progress: true
jobs:
  discover-and-collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 playwright
      - name: Install headless browser for JavaScript-rendered event lists
        run: python -m playwright install --with-deps chromium
      - name: Check importer syntax and 100,000-game warehouse stress test
        run: |
          python -m py_compile scripts/discover_metascribe_singles.py scripts/run_discovered_singles.py scripts/build_warehouse.py scripts/import_metascribe_singles.py scripts/event_identity.py scripts/import_listhammer_export.py
          python scripts/test_event_identity.py
          python scripts/test_warehouse.py
      - name: Discover 2026 11th edition singles events globally
        id: discovery
        continue-on-error: true
        run: python scripts/discover_metascribe_singles.py --pages 60 --limit 4000
      - name: Confirm fallback candidate queue is available
        run: test -s public/data/singles-discovery.json
      - name: Collect up to eight separately verified singles events
        id: ingest
        continue-on-error: true
        run: python scripts/run_discovered_singles.py --limit 12 --max-players 400
      - name: Audit overlap with existing tournament results
        run: python scripts/audit_cross_sources.py
      - name: Build deduplicated 10,000-game delivery shards
        run: python scripts/build_warehouse.py
      - name: Publish only validated game-level datasets and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in public/data/singles-discovery.json public/data/singles-discovery-status.json public/data/auto-import-status.json public/data/cross-source-audit.json public/data/warehouse-manifest.json public/data/warehouse-*.csv public/data/listhammer-import-status.json public/data/listhammer-games-*.csv public/data/singles-auto-*.csv; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified worldwide singles game evidence"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Expose import validation failures
        if: steps.ingest.outcome == 'failure'
        run: exit 1

name: Validate Listhammer WTC participant links
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/match_listhammer_wtc.py'
      - '.github/workflows/verify-listhammer-links.yml'
  schedule:
    - cron: '31 5 * * 5'
permissions:
  contents: write
concurrency:
  group: verified-listhammer-links
  cancel-in-progress: false
jobs:
  verify-links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Validate event and player + faction links
        run: python scripts/match_listhammer_wtc.py
      - name: Publish verified links only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/verified-player-links.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified WTC player profile links"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

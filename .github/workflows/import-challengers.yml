name: Import Challengers Cup 2026
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/import_metascribe_event.py'
      - '.github/workflows/import-challengers.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Collect and validate public team-event games
        run: python scripts/import_metascribe_event.py
      - name: Commit verified game records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/challengers-cup-2026.csv
          if ! git diff --cached --quiet; then
            git commit -m "Import validated Challengers Cup games"
            git push
          fi

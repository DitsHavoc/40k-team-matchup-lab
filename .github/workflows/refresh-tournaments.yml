name: Refresh verified team tournament datasets
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-tournaments.yml'
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: write
concurrency:
  group: verified-team-dataset-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Collect and audit UKTC Summer, Challengers Cup and Kent November
        id: collect
        continue-on-error: true
        run: python scripts/run_imports.py --event all
      - name: Publish CSVs and an import status report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/uktc-summer-itt-2026.csv public/data/challengers-cup-2026.csv public/data/kent-teams-november-2026.csv public/data/import-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified tournament matchup datasets"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Flag any collection failures after publishing status
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::warning::One or more event imports failed; check public/data/import-status.json. Any previously published CSVs were preserved."
          exit 1

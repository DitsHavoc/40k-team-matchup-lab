name: Import and publish London GT and LVO independently
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-singles-majors.yml'
  schedule:
    - cron: '19 6 * * 4'
permissions:
  contents: write
jobs:
  collect-major:
    strategy:
      fail-fast: false
      matrix:
        event: [lgt-2026, lvo-2026]
    concurrency:
      group: verified-major-${{ matrix.event }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Run real full-event collection and score audit
        id: collect
        continue-on-error: true
        run: python -u scripts/run_singles_imports.py --event "${{ matrix.event }}" --isolated-status
      - name: Publish audited CSV independently, or detailed failure status
        env:
          EVENT: ${{ matrix.event }}
        run: |
          case "$EVENT" in
            lgt-2026) CSV="public/data/singles-lgt-2026.csv" ;;
            lvo-2026) CSV="public/data/singles-lvo-2026.csv" ;;
            *) echo "::error::Unknown major event"; exit 1 ;;
          esac
          STATUS="public/data/singles-import-$EVENT.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATUS" || exit 1
          if [ -f "$CSV" ]; then git add "$CSV"; fi
          if ! git diff --cached --quiet; then
            git commit -m "Publish $EVENT validated individual games or failure diagnostic"
            for attempt in 1 2 3 4 5 6 7 8; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 4
            done
            echo "::error::Could not publish after retries"
            exit 1
          fi
      - name: Flag incomplete or failed import
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::${{ matrix.event }} full game collection failed; see its published independent status JSON."
          exit 1

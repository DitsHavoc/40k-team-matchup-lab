name: Import Kent Teams November 2026
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-kent-november.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Collect and audit Kent team games
        run: python scripts/import_metascribe_event.py --event kent-teams-november-2026
      - name: Publish validated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/kent-teams-november-2026.csv
          if ! git diff --cached --quiet; then
            git commit -m "Import validated Kent Teams November 2026 games"
            git push
          fi

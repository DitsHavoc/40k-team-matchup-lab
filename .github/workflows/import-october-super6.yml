name: Import October Super 6s 2026
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-october-super6.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Collect and validate October Super 6 games
        run: python scripts/import_metascribe_event.py --event october-super-6s-2026
      - name: Publish verified games
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/october-super-6s-2026.csv
          if ! git diff --cached --quiet; then
            git commit -m "Import validated October Super 6 games"
            git push
          fi
